<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personalized Landing Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    .container {
      max-width: 700px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      animation: fadeIn 0.8s ease;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    p {
      font-size: 1.1rem;
      color: #cbd5f5;
      margin-bottom: 25px;
    }

    .cta {
      display: inline-block;
      padding: 14px 28px;
      background: #3b82f6;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .cta:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="headline">Loading...</h1>
    <p id="subtext"></p>

    <a href="#" class="cta">Book a Free Demo</a>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);
    const name = p.get('fname') || 'there';
    const company = p.get('company') || 'your company';
    const industry = p.get('industry') || 'your industry';

    document.getElementById('headline').innerText =
      `Hey ${name}, here's how we help ${industry} businesses like ${company}`;

    document.getElementById('subtext').innerText =
      `We've worked with companies in the ${industry} space and know exactly what's slowing you down — and how to fix it with automation.`;
  </script>

</body>
</html>
